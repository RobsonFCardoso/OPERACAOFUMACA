<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard - Operação Fumaça</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #1f2937;
      --input-border: #374151;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
    .container { width: 100%; max-width: 480px; margin: 0 auto; }
    .app-header { background: var(--card-bg); border: 1px solid var(--card-border); padding: 14px 16px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .icon-wrap { background: rgba(37, 99, 235, 0.15); color: #60a5fa; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 18px; }
    h1 { font-size: 0.95rem; font-weight: 700; }
    p { font-size: 0.7rem; color: var(--text-muted); }
    .btn-nav { background: var(--primary); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #93c5fd; margin-bottom: 12px; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .metric-card { background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px; padding: 14px; text-align: center; }
    .metric-value { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }
    .metric-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .btn-secondary { background: #374151; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <header class="app-header">
      <div class="brand">
        <div class="icon-wrap">📊</div>
        <div>
          <h1>Dashboard</h1>
          <p>Balanço da Operação</p>
        </div>
      </div>
      <a href="index.html" class="btn-nav">🏠 Voltar Home</a>
    </header>

    <div class="card">
      <div class="section-title">📊 Resumo Geral da Planilha</div>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px;">Dados sincronizados em tempo real com o Google Sheets.</p>
      
      <div class="dashboard-grid">
        <div class="metric-card">
          <div class="metric-label">Total Testados</div>
          <div class="metric-value" id="statTotal" style="color: #60a5fa;">...</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Aprovados</div>
          <div class="metric-value" id="statAprovados" style="color: #34d399;">...</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Reprovados</div>
          <div class="metric-value" id="statReprovados" style="color: #f87171;">...</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Liberados</div>
          <div class="metric-value" id="statLiberados" style="color: #22d3ee;">...</div>
        </div>
      </div>

      <button type="button" class="btn-secondary" onclick="carregarDashboard()">🔄 Atualizar Dados</button>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgeT4AWUirYEJZHnrfsMpz-J48rJhQTsnlAugBXBagWgg2YBE1xZ7iXRk2HfWSa8sZ7g/exec";

  async function carregarDashboard() {
    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();
      document.getElementById('statTotal').textContent = data.total || 0;
      document.getElementById('statAprovados').textContent = data.aprovados || 0;
      document.getElementById('statReprovados').textContent = data.reprovados || 0;
      document.getElementById('statLiberados').textContent = data.liberados || 0;
    } catch (e) {
      alert("Erro ao puxar dados da planilha.");
    }
  }

  // Carrega ao abrir a página
  carregarDashboard();
</script>
</body>
</html>
